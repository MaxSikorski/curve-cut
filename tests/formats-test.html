<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RUNNING</title>
</head>
<body>
<pre id="log"></pre>
<script src="../vendor/three/three.min.js"></script>
<script src="../vendor/fflate/fflate.min.js"></script>
<script src="../vendor/three/OBJLoader.js"></script>
<script src="../vendor/three/3MFLoader.js"></script>
<script src="../vendor/manifold/manifold.wasm.b64.js"></script>
<script src="../vendor/manifold/manifold.js"></script>
<script src="../js/cut-core.js"></script>
<script src="../js/bigprint-core.js"></script>
<script>
/* Headless tests for v1.6: OBJ import, 3MF export round-trip, and the
   basic repair ladder. Run via tools/check_formats.py.
   Title: "PASS" or "FAIL: <names>". */
(async () => {
    const log = (m) => { document.getElementById("log").textContent += m + "\n"; };
    const fails = [];
    const check = (name, cond, detail) => {
        log(`${cond ? "ok  " : "FAIL"} ${name}${detail ? " — " + detail : ""}`);
        if (!cond) fails.push(name);
    };
    const near = (a, b, eps = 1e-3) => Math.abs(a - b) < eps;

    try {
        await CutCore.init();
        const B = window.BigPrintCore;

        // --- OBJ import: 10mm cube through the vendored loader
        const objText = ["v 0 0 0", "v 10 0 0", "v 10 10 0", "v 0 10 0",
            "v 0 0 10", "v 10 0 10", "v 10 10 10", "v 0 10 10",
            "f 1 3 2", "f 1 4 3", "f 5 6 7", "f 5 7 8", "f 1 2 6", "f 1 6 5",
            "f 2 3 7", "f 2 7 6", "f 3 4 8", "f 3 8 7", "f 4 1 5", "f 4 5 8"].join("\n");
        const group = new THREE.OBJLoader().parse(objText);
        let objGeo = null;
        group.traverse((c) => { if (c.isMesh && !objGeo) objGeo = c.geometry; });
        check("OBJ parses to a mesh", !!objGeo);
        check("OBJ cube volume exact", near(CutCore.geometryVolume(objGeo), 1000),
            String(CutCore.geometryVolume(objGeo)));
        check("OBJ cube is watertight after weld", CutCore.isWatertight(objGeo));

        // --- 3MF export -> vendored 3MFLoader round-trip
        const box = new THREE.BoxGeometry(10, 20, 30).toNonIndexed();
        box.translate(0, 10, 0); // floor at scene y=0
        const { vertProperties, triVerts } = CutCore.weldGeometry(box);
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.BufferAttribute(vertProperties, 3));
        g.setIndex(new THREE.BufferAttribute(triVerts, 1));
        const mfBytes = B.serialize3MF(g);
        const back = new THREE.ThreeMFLoader().parse(mfBytes.buffer);
        let parsed = null;
        back.traverse((c) => { if (c.isMesh && !parsed) parsed = c.geometry; });
        check("3MF round-trip parses", !!parsed);
        check("3MF round-trip volume exact", near(CutCore.geometryVolume(parsed), 6000),
            String(CutCore.geometryVolume(parsed)));
        parsed.computeBoundingBox();
        check("scene height (Y) became printer height (Z) in the 3MF",
            near(parsed.boundingBox.min.z, 0) && near(parsed.boundingBox.max.z, 20),
            `${parsed.boundingBox.min.z}..${parsed.boundingBox.max.z}`);

        // --- 3MF earns its keep on real meshes
        const sphere = new THREE.SphereGeometry(20, 64, 48);
        const stlSize = B.serializeSTL(sphere).length;
        const mfSize = B.serialize3MF(sphere).length;
        check("3MF at least 60% smaller than STL on a 6k-tri mesh",
            mfSize < stlSize * 0.4, `${mfSize} vs ${stlSize}`);

        // --- repair ladder: hairline crack welds shut, real hole stays honest
        const cracked = new THREE.BoxGeometry(10, 10, 10).toNonIndexed();
        const pos = cracked.getAttribute("position");
        for (let t = 0; t < pos.count; t += 3) {
            if (pos.getY(t) === 5 && pos.getY(t + 1) === 5 && pos.getY(t + 2) === 5) {
                for (let k = 0; k < 3; k++) pos.setY(t + k, 5.03); // 0.03mm seam
            }
        }
        check("cracked cube rejected by the exact weld", !CutCore.isWatertight(cracked));
        const r = CutCore.repairGeometry(cracked);
        check("repair ladder closes the 0.03mm seam", !!r && r.tol <= 0.1,
            r && `welded at ${r.tol}mm`);
        if (r) {
            const rg = new THREE.BufferGeometry();
            rg.setAttribute("position", new THREE.BufferAttribute(r.vertProperties, 3));
            rg.setIndex(new THREE.BufferAttribute(r.triVerts, 1));
            check("repaired cube volume exact", near(CutCore.geometryVolume(rg), 1000, 0.5),
                String(CutCore.geometryVolume(rg)));
            check("repaired cube is watertight", CutCore.isWatertight(rg));
        }

        const open = new THREE.BoxGeometry(10, 10, 10).toNonIndexed();
        const trimmed = open.getAttribute("position").array.slice(0, (36 - 6) * 3);
        const openG = new THREE.BufferGeometry();
        openG.setAttribute("position", new THREE.BufferAttribute(trimmed, 3));
        const openRepair = CutCore.repairGeometry(openG);
        let openWatertight = false;
        if (openRepair) {
            const repairedOpen = new THREE.BufferGeometry();
            repairedOpen.setAttribute("position",
                new THREE.BufferAttribute(openRepair.vertProperties, 3));
            repairedOpen.setIndex(new THREE.BufferAttribute(openRepair.triVerts, 1));
            openWatertight = CutCore.isWatertight(repairedOpen);
        }
        check("a real hole can't be welded shut (cap rung handles it)",
            !!openRepair && openRepair.method === "cap" && openRepair.loops === 1 && openWatertight);

        document.title = fails.length ? `FAIL: ${fails.join("; ")}` : "PASS";
    } catch (err) {
        log("EXCEPTION " + (err.stack || err));
        document.title = "FAIL: exception — " + err.message;
    }
})();
</script>
</body>
</html>
