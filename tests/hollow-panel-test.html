<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RUNNING</title>
    <style>iframe { width: 1280px; height: 800px; border: 0; }</style>
</head>
<body>
<pre id="log"></pre>
<iframe id="app"></iframe>
<script>
/* The Hollow panel (lamp phase 1b), driven through the real app in the frame.
   Run via tools/check_hollow_panel.py (needs --allow-file-access-from-files so
   this page can reach the frame). Result in document.title. */
(() => {
    "use strict";

    const frame = document.getElementById("app");
    // keep the welcome tour from starting by itself (it would take focus and Escape)
    try { localStorage.setItem("curvecut-tour", "done"); } catch (_) { /* the tour is then handled per step */ }
    frame.src = "../index.html";
    const log = (m) => { document.getElementById("log").textContent += m + "\n"; };
    const fails = [];
    const check = (name, cond, detail) => {
        log(`${cond ? "ok  " : "FAIL"} ${name}${detail ? " — " + detail : ""}`);
        if (!cond) fails.push(name);
    };
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const waitFor = async (test, timeout = 8000) => {
        const deadline = performance.now() + timeout;
        while (performance.now() < deadline) {
            let ok = false;
            try { ok = test(); } catch (_) { ok = false; }
            if (ok) return true;
            await sleep(25);
        }
        try { return !!test(); } catch (_) { return false; }
    };

    let win, doc, CC, THREE_;
    const $ = (id) => doc.getElementById(id);
    const visible = (id) => {
        const el = $(id);
        if (!el || el.hidden) return false;
        const cs = win.getComputedStyle(el);
        return cs.visibility !== "hidden" && cs.display !== "none" && parseFloat(cs.opacity) > 0.5;
    };
    const setValue = (id, value) => {
        const el = $(id);
        el.value = String(value);
        el.dispatchEvent(new win.Event("input", { bubbles: true }));
        el.dispatchEvent(new win.Event("change", { bubbles: true }));
    };
    const setChecked = (id, on) => {
        const el = $(id);
        if (el.checked !== on) el.click();
    };
    const rawEscape = () => win.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    // the welcome tour can start by itself and would own Escape: end it first
    const escape = () => { if (CC.tour && CC.tour.isActive()) CC.tour.end(); rawEscape(); };
    const triCount = (geometry) => {
        const index = geometry.getIndex();
        return (index ? index.count : geometry.attributes.position.count) / 3;
    };
    const signedVolume = (geometry) => {
        const p = geometry.attributes.position, index = geometry.getIndex();
        const n = index ? index.count : p.count;
        const at = (i) => { const k = index ? index.getX(i) : i; return [p.getX(k), p.getY(k), p.getZ(k)]; };
        let v = 0;
        for (let i = 0; i < n; i += 3) {
            const a = at(i), b = at(i + 1), c = at(i + 2);
            v += (a[0] * (b[1] * c[2] - b[2] * c[1]) - a[1] * (b[0] * c[2] - b[2] * c[0])
                + a[2] * (b[0] * c[1] - b[1] * c[0])) / 6;
        }
        return v;
    };
    const previewMesh = () => CC.scene.children.find((o) => o.userData && o.userData.hollowPreview) || null;
    const cube = () => new win.THREE.BoxGeometry(60, 60, 60).toNonIndexed();
    const ball = () => new win.THREE.SphereGeometry(1000, 200, 200).toNonIndexed();
    const idle = () => !CC.ops.busy();
    const load = async (geometry, name) => {
        // an automatic mesh check can start late and make the app refuse the load: retry until it lands
        for (let attempt = 0; attempt < 8; attempt++) {
            await waitFor(idle, 60000);
            await sleep(300);
            await waitFor(idle, 60000);
            CC.loadGeometry(geometry, name);
            if (CC.pieces.length === 1 && CC.pieces[0].name === name) break;
        }
        await waitFor(idle, 60000);
        await sleep(50);
        await waitFor(idle, 60000);
    };
    const attach = async () => {
        await waitFor(() => frame.contentWindow && frame.contentWindow.CurveCut
            && typeof frame.contentWindow.CurveCut.loadGeometry === "function"
            && frame.contentWindow.CurveCut.hollow && frame.contentWindow.CurveCut.compute
            && frame.contentWindow.CurveCut.hollowCore, 30000);
        win = frame.contentWindow; doc = win.document; CC = win.CurveCut;
        spyCompute();
        if (CC.tour && CC.tour.isActive()) CC.tour.end(); // the welcome tour owns Escape and focus
        win.addEventListener("error", (e) => pageErrors.push(String(e.message)));
    };
    const pageErrors = [];
    const near = (a, b, tol) => Math.abs(a - b) <= tol;
    // which "hollow-panel-N" worker copies were primed, and which were really released
    const primed = new Set(), released = new Set();
    const spyCompute = () => {
        const real = CC.compute.run;
        CC.compute.run = function (op, payload, options) {
            const promise = real.call(this, op, payload, options);
            const name = payload && payload.token;
            if (typeof name === "string" && name.startsWith("hollow-panel-")) {
                if (op === "prime") primed.add(name);
                if (op === "release") promise.then(() => released.add(name), () => {});
            }
            return promise;
        };
    };
    const leaked = () => [...primed].filter((n) => !released.has(n));
    const lastToast = () => { const t = doc.querySelectorAll(".toast .stats-name"); return t.length ? t[t.length - 1].textContent : ""; };
    const statusText = () => $("hollow-status").textContent;
    const history = [];
    const watchStatus = () => new win.MutationObserver(() => history.push(statusText()))
        .observe($("hollow-status"), { childList: true, characterData: true, subtree: true });
    const openPanel = async () => {
        // the button refuses (toast) while an automatic check still runs: retry
        const deadline = performance.now() + 60000;
        while (performance.now() < deadline && !visible("hollow-panel")) {
            await waitFor(idle, 60000);
            $("hollow-btn").click();
            await waitFor(() => visible("hollow-panel"), 2500);
        }
    };
    // the automatic mesh check can start a moment after a load: Preview would be refused
    const clickPreview = async () => { await waitFor(idle, 60000); await sleep(150); await waitFor(idle, 60000); $("hollow-preview").click(); };
    const preview = async () => {
        await clickPreview();
        return waitFor(() => !$("hollow-confirm").disabled, 60000);
    };

    (async () => {
        try {
            // P0
            await attach();
            check("P0 harness: CurveCut reachable in the frame", !!CC);
            check("P0 harness: 1a engine present (CC.hollowCore.bottomPlane)",
                !!(CC && CC.hollowCore && CC.hollowCore.bottomPlane));
            watchStatus();
            try { win.localStorage.removeItem("curvecut-hollow"); } catch (_) { /* ignore */ }

            await load(cube(), "cube");
            const solid = CC.pieces[0];
            const undoBefore = CC.history.memoryReport().undoEntries;

            // P1
            check("P1 hollow button sits in the action dock",
                !!$("hollow-btn") && !!$("hollow-btn").closest("#action-dock"));
            await openPanel();
            await waitFor(() => !visible("action-dock"), 3000);
            check("P1 panel visible, dock hidden", visible("hollow-panel") && !visible("action-dock"));
            await waitFor(() => !visible("view-dock") && !visible("pieces-panel"), 3000);
            check("P1 view dock and pieces panel hidden while open", !visible("view-dock") && !visible("pieces-panel"));
            check("P1 Open row label is not a form label", $("hollow-open-faces").previousElementSibling.tagName === "SPAN");
            await waitFor(() => doc.activeElement === $("hollow-wall"), 2000);
            check("P1 focus on the wall field", doc.activeElement === $("hollow-wall"),
                doc.activeElement && (doc.activeElement.id || doc.activeElement.tagName));
            check("P1 defaults: wall 6, Lamp and Bottom off",
                $("hollow-wall").value === "6" && !$("hollow-lamp").checked && !$("hollow-open-bottom").checked);
            check("P1 hint", $("hollow-wall-hint").textContent === "≈ 15 walls @ 0.4 mm",
                $("hollow-wall-hint").textContent);
            check("P1 Confirm disabled", $("hollow-confirm").disabled);
            check("P1 idle status", statusText().startsWith("Set the wall, then Preview hollowed."), statusText());

            // P2
            setChecked("hollow-lamp", true);
            check("P2 Lamp tick sets 2.4 + Bottom",
                $("hollow-wall").value === "2.4" && $("hollow-open-bottom").checked
                && $("hollow-wall-hint").textContent === "≈ 6 walls @ 0.4 mm", $("hollow-wall").value);
            setChecked("hollow-lamp", false);
            check("P2 Lamp untick resets 6 + Bottom off",
                $("hollow-wall").value === "6" && !$("hollow-open-bottom").checked);
            setChecked("hollow-lamp", true);

            // P3
            await waitFor(idle, 60000); await sleep(300);
            const ok3 = await preview();
            const pm = previewMesh();
            check("P3 preview ready", ok3 && !!pm);
            check("P3 source untouched, hidden, 12 triangles",
                CC.pieces[0] === solid && solid.visible === false && triCount(solid.geometry) === 12);
            check("P3 preview volume 40490.496", pm && near(signedVolume(pm.geometry), 40490.496, 0.01),
                pm && String(signedVolume(pm.geometry)));
            check("P3 history unchanged", CC.history.memoryReport().undoEntries === undoBefore);
            check("P3 status", statusText().startsWith("Preview ready · saves 81.3% of material · bottom open"), statusText());
            check("P3 no stale badge, no warnings", !visible("hollow-stale") && $("hollow-warnings").hidden);

            // P4
            setValue("hollow-wall", 3);
            check("P4 wall change -> Out of date",
                visible("hollow-stale") && $("hollow-stale").textContent === "Out of date"
                && $("hollow-confirm").disabled
                && statusText().startsWith("Settings changed since the preview"), statusText());
            setValue("hollow-wall", 2.4);
            check("P4 wall back -> fresh", !visible("hollow-stale") && !$("hollow-confirm").disabled);
            setChecked("hollow-open-bottom", false);
            const staleOff = visible("hollow-stale") && $("hollow-confirm").disabled;
            setChecked("hollow-open-bottom", true);
            check("P4 Bottom off -> stale, on -> fresh",
                staleOff && !visible("hollow-stale") && !$("hollow-confirm").disabled);

            // P5
            const geo5 = previewMesh().geometry;
            // another compute job (Big Print's own release in the real app) is running at Confirm time
            CC.compute.run("ping", {}).catch(() => {});
            $("hollow-confirm").click();
            await waitFor(() => !visible("hollow-panel"), 4000);
            const h = CC.pieces[0].userData.hollow;
            check("P5 one piece, same geometry object", CC.pieces.length === 1 && CC.pieces[0].geometry === geo5);
            check("P5 receipt", !!h && h.v === 1 && h.wallMm === 2.4 && h.lamp === true
                && h.openFaces[0].label === "Bottom" && h.openFaces[0].opened === true && h.holes.count === 0,
                JSON.stringify(h && { v: h.v, w: h.wallMm, l: h.lamp }));
            check("P5 CC.hollow.confirmed() is the receipt", CC.hollow.confirmed() === h);
            check("P5 CC.hollow.status() is confirmed",
                typeof CC.hollow.status === "function" && CC.hollow.status() === "confirmed");
            check("P5 view dock and pieces panel back",
                await waitFor(() => visible("view-dock") && visible("pieces-panel"), 3000));
            const released5 = await waitFor(() => primed.size > 0 && leaked().length === 0, 6000);
            check("P5 panel's worker copy released after Confirm", released5, `leaked ${leaked().join(",")}`);
            check("P5 chip note", $("stats-detail").textContent.includes("· hollow 2.4 mm, open bottom"),
                $("stats-detail").textContent);
            await waitFor(() => visible("action-dock"), 3000);
            check("P5 panel hidden, dock visible", !visible("hollow-panel") && visible("action-dock"));
            check("P5 no preview mesh left", previewMesh() === null);
            check("P5 one undo step", CC.history.memoryReport().undoEntries === undoBefore + 1);
            check("P5 units locked, reset hidden", $("units-trigger").disabled && $("stats-reset").hidden);

            // P6
            $("undo-btn").click();
            await waitFor(() => CC.pieces[0] === solid, 4000);
            check("P6 undo: original mesh back, visible, 12 tris, volume 216000",
                CC.pieces[0] === solid && solid.visible === true && triCount(solid.geometry) === 12
                && near(signedVolume(solid.geometry), 216000, 0.01));
            check("P6 undo: no chip note, not confirmed, units enabled",
                !$("stats-detail").textContent.includes("hollow") && !CC.hollow.confirmed()
                && !$("units-trigger").disabled);
            check("P6 undo: CC.hollow.status() is none",
                typeof CC.hollow.status === "function" && CC.hollow.status() === "none");
            $("redo-btn").click();
            await waitFor(() => CC.pieces[0] !== solid, 4000);
            check("P6 redo: hollow back with chip note",
                !!CC.pieces[0].userData.hollow && $("stats-detail").textContent.includes("· hollow 2.4 mm, open bottom"));

            // P7
            await openPanel();
            check("P7 already hollow", statusText().startsWith("This model is already hollow (2.4 mm, open bottom)")
                && $("hollow-preview").disabled && $("hollow-confirm").disabled, statusText());
            escape();
            await waitFor(() => !visible("hollow-panel"), 3000);
            check("P7 Escape closes", !visible("hollow-panel"),
                `tour ${CC.tour.isActive()} open ${CC.hollow.isOpen()} busy ${CC.ops.busyName()} errs ${pageErrors.join("|")} tourfn ${String(CC.tour.isActive)}`);
            $("undo-btn").click();
            await waitFor(() => CC.pieces[0] === solid, 4000);

            // P8
            const extra = new win.THREE.Mesh(solid.geometry.clone(), solid.material);
            CC.scene.add(extra); CC.pieces.push(extra);
            win.dispatchEvent(new win.CustomEvent("curvecut:pieces-changed"));
            await openPanel();
            check("P8 more than one piece", statusText().startsWith("Hollow before cutting")
                && $("hollow-preview").disabled && $("hollow-confirm").disabled, statusText());
            CC.scene.remove(extra); CC.pieces.pop();
            win.dispatchEvent(new win.CustomEvent("curvecut:pieces-changed"));
            await waitFor(() => !$("hollow-preview").disabled, 2000);
            check("P8 back to idle", statusText().startsWith("Set the wall") && !$("hollow-preview").disabled, statusText());
            escape();
            await waitFor(() => !visible("hollow-panel"), 3000);

            // P9
            await openPanel();
            setChecked("hollow-lamp", true); setChecked("hollow-lamp", false);
            setValue("hollow-wall", 6);
            await waitFor(idle, 60000); await sleep(300);
            await preview();
            const pm9 = previewMesh();
            const old9 = CC.pieces[0];
            check("P9 plain preview volume 105408", pm9 && near(signedVolume(pm9.geometry), 105408, 0.01),
                pm9 && String(signedVolume(pm9.geometry)));
            check("P9 status without bottom open", !statusText().includes("bottom open"), statusText());
            await load(cube(), "cube2");
            await waitFor(() => !visible("hollow-panel"), 3000); // the close fade takes 0.4 s
            check("P9 panel closed, no preview, old source visible, all pieces visible",
                !visible("hollow-panel") && previewMesh() === null && old9.visible === true
                && CC.pieces.every((m) => m.visible));
            await waitFor(idle, 60000);
            const released9 = await waitFor(() => leaked().length === 0, 6000);
            check("P9 panel's worker copy released", released9, `leaked ${leaked().join(",")}`);

            // P10
            await load(ball(), "ball");
            const ballMesh = CC.pieces[0];
            check("P10 ball watertight and over 50k tris",
                win.CutCore.isWatertight(ballMesh.geometry) && triCount(ballMesh.geometry) > 50000,
                String(triCount(ballMesh.geometry)));
            await openPanel();
            setChecked("hollow-lamp", true);
            await clickPreview();
            await waitFor(() => /too big|failed|cancelled/.test(statusText()), 120000);
            await waitFor(idle, 30000);
            check("P10 grid-too-large message",
                statusText().includes("too big to hollow at 2.4 mm walls yet")
                && statusText().includes("64 million") && statusText().includes("mm or thicker"),
                statusText() + " || history: " + history.slice(-6).join(" | "));
            check("P10 model unchanged, no preview, not busy",
                CC.pieces[0] === ballMesh && ballMesh.visible && previewMesh() === null && idle());

            // P11
            const fmt = CC.hollow._test.gridTooLargeMessage;
            const m11 = fmt(2.4, 85800000);
            check("P11 formatter with voxels", m11.includes("86 million") && m11.includes("about 2.7 mm"), m11);
            check("P11 formatter without voxels", fmt(2.4) ===
                "This model is too big to hollow at 2.4 mm walls yet. Try a thicker wall for now. Thin lamp walls on big models come with the smooth-inside update.");

            // P12 (panel is open on the ball)
            setChecked("hollow-lamp", false);
            setChecked("hollow-open-bottom", false);
            setValue("hollow-wall", 16);
            await clickPreview();
            const started = await waitFor(() => CC.ops.busyName() === "hollow", 20000);
            const pill = await waitFor(() => /^Hollowing/.test((doc.getElementById("progress-label") || {}).textContent || ""), 60000);
            check("P12 hollow running with Hollowing pill", started && pill);
            escape();
            const stopped = await waitFor(idle, 20000);
            await waitFor(() => statusText().startsWith("Hollowing cancelled"), 3000);
            check("P12 Escape stops within 20 s, status says so",
                stopped && statusText().startsWith("Hollowing cancelled — model unchanged."), statusText());
            check("P12 model unchanged, no preview, panel open",
                CC.pieces[0] === ballMesh && ballMesh.visible && previewMesh() === null && visible("hollow-panel"));
            escape();
            await waitFor(() => !visible("hollow-panel"), 3000);
            await load(cube(), "cube3");
            await openPanel();
            setValue("hollow-wall", 6);
            await preview();
            const pm12 = previewMesh();
            check("P12 worker recovered: next preview works",
                pm12 && near(signedVolume(pm12.geometry), 105408, 0.01),
                statusText() + " || history: " + history.slice(-6).join(" | "));
            escape();
            await waitFor(() => !visible("hollow-panel"), 3000);

            // P15-P19: review fixes (cube3 is loaded, panel closed)
            await openPanel();
            setValue("hollow-wall", 6);
            await preview();
            const src15 = CC.pieces[0];
            $("units-trigger").click();
            await sleep(500);
            check("P15 units refused while the Hollow panel is open",
                !visible("units-overlay") && lastToast().includes("Close the Hollow panel first"), lastToast());
            $("stats-repair").click();
            await sleep(500);
            check("P15 repair refused while the Hollow panel is open",
                !CC.ops.busy() && CC.pieces[0] === src15 && src15.visible === false
                && lastToast().includes("Close the Hollow panel first"), lastToast());

            // P16: a replaced piece that inherited the hidden flag is shown again
            const other16 = new win.THREE.Mesh(src15.geometry.clone(), src15.material);
            other16.visible = false;
            CC.scene.add(other16); CC.pieces[0] = other16;
            win.dispatchEvent(new win.CustomEvent("curvecut:pieces-changed"));
            check("P16 every piece visible after the model changed under a preview",
                other16.visible === true && src15.visible === true && previewMesh() === null);
            CC.scene.remove(other16); CC.pieces[0] = src15;
            win.dispatchEvent(new win.CustomEvent("curvecut:pieces-changed"));

            // P17: compute busy at the moment of the run: status must not stick on "Hollowing…"
            await preview();
            let ping = null;
            await waitFor(() => { try { ping = CC.compute.run("ping", {}); return true; } catch (_) { return false; } }, 5000);
            $("hollow-preview").click();
            await ping.catch(() => {});
            await sleep(400);
            check("P17 busy refusal leaves a sane status and an enabled Preview",
                !statusText().includes("press Escape") && !$("hollow-preview").disabled
                && lastToast().includes("still running"), statusText() + " | " + lastToast());
            check("P17 not left running", !CC.hollow.busy() && idle());

            // P18: undo with an earlier step present while a preview is shown
            await waitFor(idle, 60000);
            CC.history.capture();
            await preview();
            const src18 = CC.pieces[0];
            $("undo-btn").click();
            await waitFor(() => previewMesh() === null, 4000);
            check("P18 undo under a preview: source visible, no preview, panel says so",
                CC.pieces.every((m) => m.visible) && previewMesh() === null
                && statusText().startsWith("The model changed"), statusText());
            check("P18 undo: source geometry still drawn", src18.visible === true || CC.pieces[0] !== src18);

            // P19: Escape does nothing to the panel while the tour is running
            const realActive = CC.tour.isActive;
            CC.tour.isActive = () => true;
            rawEscape();
            await sleep(300);
            const stayed = visible("hollow-panel");
            CC.tour.isActive = realActive;
            check("P19 Escape ignored while the tour is active", stayed);
            escape();
            await waitFor(() => !visible("hollow-panel"), 3000);
            check("P19 view dock and pieces panel restored on close",
                await waitFor(() => visible("view-dock") && visible("pieces-panel"), 3000));

            // P13
            await openPanel();
            setChecked("hollow-lamp", false);
            setValue("hollow-wall", 3.2);
            setChecked("hollow-open-bottom", true);
            escape();
            await waitFor(() => !visible("hollow-panel"), 3000);
            const stored = JSON.parse(win.localStorage.getItem("curvecut-hollow"));
            check("P13 stored settings", stored && stored.v === 1 && stored.wallMm === 3.2
                && stored.lamp === false && stored.openBottom === true, JSON.stringify(stored));
            frame.src = frame.src;
            await sleep(500);
            await waitFor(() => frame.contentWindow && frame.contentWindow.CurveCut
                && frame.contentWindow.CurveCut !== CC, 30000);
            await attach();
            await load(cube(), "cube4");
            await openPanel();
            check("P13 restored after reload", $("hollow-wall").value === "3.2"
                && $("hollow-open-bottom").checked && !$("hollow-lamp").checked, $("hollow-wall").value);
            escape();
            await waitFor(() => !visible("hollow-panel"), 3000);

            // P14
            win.localStorage.setItem("curvecut-hollow", "{not json");
            await openPanel();
            check("P14 bad JSON -> defaults", $("hollow-wall").value === "6"
                && !$("hollow-lamp").checked && !$("hollow-open-bottom").checked);
            escape();
            await waitFor(() => !visible("hollow-panel"), 3000);
            Object.defineProperty(win, "localStorage", { get() { throw new Error("blocked"); } });
            await openPanel();
            setValue("hollow-wall", 6);
            const ok14 = await preview();
            check("P14 blocked storage: panel and Preview still work", ok14 && !!previewMesh()
                && pageErrors.length === 0, pageErrors.join("; "));
            escape();

            // ===== lamp 1c: Big Print uses the confirmed hollow (B0-B9, B3b)
            // P14 broke the frame's storage: start from a fresh frame
            {
                const oldCC = CC;
                frame.src = frame.src;
                await sleep(500);
                await waitFor(() => frame.contentWindow && frame.contentWindow.CurveCut
                    && frame.contentWindow.CurveCut !== oldCC, 30000);
                await attach();
            }
            try { win.localStorage.removeItem("curvecut-hollow"); } catch (_) { /* ignore */ }
            win.showSaveFilePicker = undefined;
            const captures = [];
            win.HTMLAnchorElement.prototype.click = function () {
                captures.push({ name: this.download, href: this.href });
            };
            const hstatus = () => (typeof CC.hollow.status === "function" ? CC.hollow.status() : "no status()");
            const toast = () => $("toast-live").textContent;
            const settled = (el) => !win.gsap.isTweening(el);
            const dockSettled = () => settled($("action-dock")) && settled($("hollow-panel"));
            const hollowCube = async () => {
                await load(cube(), "cube");
                // the first load reveals the docks over about a second: let that finish before the panel hides them
                await waitFor(() => visible("action-dock") && visible("view-dock"), 5000);
                await waitFor(() => settled($("action-dock")) && settled($("view-dock")), 5000);
                await openPanel();
                setChecked("hollow-lamp", false);
                setChecked("hollow-lamp", true); // wall 2.4 + Bottom, whatever was stored
                await preview();
            };
            const confirmAndSettle = async () => {
                $("hollow-confirm").click();
                await waitFor(() => !visible("hollow-panel"), 4000);
                await waitFor(dockSettled, 4000);
            };
            const readCapture = async (cap) =>
                new Uint8Array(await (await win.fetch(cap.href)).arrayBuffer());
            const stlVolume = (bytes) => signedVolume(new win.THREE.STLLoader().parse(
                bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength)));
            const partNames = (zip) => Object.keys(zip).filter((n) => /^Part_.*\.stl$/.test(n)).sort();
            const textOf = (bytes) => new win.TextDecoder().decode(bytes);
            const setBed = (w, d, h, margin, gap) => {
                setValue("bp-bed-w", w); setValue("bp-bed-d", d); setValue("bp-bed-h", h);
                setValue("bp-margin", margin); setValue("bp-gap", gap);
            };
            const runExport = async () => {
                captures.length = 0;
                CC.bigPrint._lastExport = null;
                await waitFor(() => CC.cutFlow.isEngineReady(), 60000);
                // the Big Print warm-up can hold the coordinator for a moment: a refused click is retried
                for (let attempt = 0; attempt < 10; attempt++) {
                    if (!(await waitFor(idle, 60000))) log(`runExport: still busy with "${CC.ops.busyName()}" after 60 s`);
                    await sleep(100);
                    await waitFor(idle, 60000);
                    $("bp-export").click();
                    if (await waitFor(() => CC.ops.busyName() === "bigprint" || !!CC.bigPrint._lastExport, 1500)) break;
                }
                await waitFor(() => !!CC.bigPrint._lastExport || /failed|Stopped/.test(toast()), 300000);
                await waitFor(idle, 60000);
                const cap = captures[captures.length - 1];
                const zip = cap ? win.fflate.unzipSync(await readCapture(cap)) : null;
                return { result: CC.bigPrint._lastExport, zip, toast: toast(), zipName: cap && cap.name };
            };
            const enterBigPrint = async () => {
                await waitFor(() => settled($("action-dock")), 4000);
                // an automatic mesh check can start late and make the button refuse (toast): retry until it opens
                for (let attempt = 0; attempt < 10; attempt++) {
                    await waitFor(idle, 60000);
                    await sleep(150);
                    await waitFor(idle, 60000);
                    $("bigprint-btn").click();
                    if (await waitFor(() => CC.bigPrint.isActive(), 1500)) break;
                }
            };

            // B0
            await hollowCube();
            const solidB = CC.pieces[0];
            await waitFor(() => !visible("action-dock") && !visible("bigprint-btn"), 3000); // buttons ease their visibility
            check("B0 unconfirmed: Big Print button not visible while the panel is open", !visible("bigprint-btn"),
                `dock ${win.getComputedStyle($("action-dock")).visibility}/${win.getComputedStyle($("action-dock")).opacity}, `
                + `button ${win.getComputedStyle($("bigprint-btn")).visibility}, open ${CC.hollow.isOpen()}`);
            CC.bigPrint.enter();
            check("B0 unconfirmed: enter() refused with the plain words",
                !CC.bigPrint.isActive() && toast().includes("Hollow isn't confirmed yet: Confirm it in the Hollow panel"),
                toast());
            await confirmAndSettle();
            const hollowB = CC.pieces[0];
            check("B0 Confirm: status confirmed, solidGeometry is the old source geometry",
                hstatus() === "confirmed" && hollowB !== solidB
                && typeof CC.hollow.solidGeometry === "function" && CC.hollow.solidGeometry() === solidB.geometry, hstatus());

            // B1
            await enterBigPrint();
            await waitFor(() => visible("bigprint-panel") && settled($("bigprint-panel")), 3000);
            const note1 = $("bp-hollow-note") ? $("bp-hollow-note").textContent : "";
            check("B1 confirmed enters: scale, slider and size boxes locked",
                CC.bigPrint.isActive() && $("bp-scale").disabled && $("bp-scale-slider").disabled && $("bp-size").disabled);
            check("B1 note names the hollow and the saving", note1.startsWith("Hollow 2.4 mm, open bottom · saves 81.3%"), note1);
            check("B1 Hollow… button hidden", !!$("bp-hollow-open") && !visible("bp-hollow-open"));
            check("B1 old hollow row gone", doc.getElementById("bp-hollow-on") === null
                && doc.getElementById("bp-hollow-apply") === null && doc.getElementById("bp-glow-swatch") === null);
            check("B1 desktop keeps the view dock", visible("view-dock"));

            // B2
            setValue("bp-scale", 3);
            check("B2 lock holds: scale snaps back to 1, size 60",
                CC.pieces[0].scale.x === 1 && $("bp-scale").value === "1" && $("bp-size").value === "60",
                `${CC.pieces[0].scale.x} ${$("bp-scale").value} ${$("bp-size").value}`);

            // B3
            setChecked("bp-connectors", false);
            setBed(40, 40, 40, 2, 0);
            setChecked("bp-engrave", false);
            $("bp-format").value = "stl";
            const t3 = performance.now();
            const e3 = await runExport();
            const names3 = e3.zip ? partNames(e3.zip) : [];
            const vol3 = names3.reduce((sum, n) => sum + stlVolume(e3.zip[n]), 0);
            const man3 = e3.zip && e3.zip["manifest.txt"] ? textOf(e3.zip["manifest.txt"]) : "";
            log(`B3 export ${Math.round(performance.now() - t3)} ms, ${names3.length} parts, volume ${vol3.toFixed(3)}`);
            check("B3 hollow export: 8 parts in the zip", !!e3.result && e3.result.parts === 8 && names3.length === 8,
                `${e3.result && e3.result.parts} / ${names3.length}`);
            check("B3 summed part volume is the hollow volume (40490.496 +- 1)", near(vol3, 40490.496, 1), vol3.toFixed(3));
            check("B3 manifest states the hollow",
                man3.includes("Hollow:") && man3.includes("Wall: 2.4 mm") && man3.includes("Open faces: Bottom")
                && man3.includes("Drilled holes: 0") && man3.includes("Material saved: 81.3%")
                && !man3.includes("Asked to open"), man3.split("\n").filter((l) => /Hollow|Wall|Open|Drilled/.test(l)).join(" | "));
            check("B3 done toast names the hollow choice", e3.toast.includes("hollow, 2.4 mm wall"), e3.toast);

            // B4
            setChecked("bp-connectors", true);
            setChecked("bp-engrave", true);
            const e4 = await runExport();
            const man4 = e4.zip && e4.zip["manifest.txt"] ? textOf(e4.zip["manifest.txt"]) : "";
            check("B4 blocks from the solid: manifest says so",
                man4.includes("Hollow parts: connectors and ID labels sit on small solid blocks"),
                man4.split("\n").filter((l) => /Hollow parts/.test(l)).join(" | "));
            check("B4 no block failure, at least 8 parts",
                !e4.toast.includes("couldn't be made") && !!e4.result && e4.result.parts >= 8,
                `${e4.result && e4.result.parts} parts; ${e4.toast}`);

            // B3b: a box, Lamp off, 6 mm wall, no open faces (ticket 1: the hollow choice agrees with the parts)
            $("bp-cancel").click();
            await waitFor(() => !CC.bigPrint.isActive(), 3000);
            await load(new win.THREE.BoxGeometry(300, 600, 300).toNonIndexed(), "box");
            const boxSolid = CC.pieces[0];
            const setupBox = () => {
                setChecked("bp-connectors", true);
                setBed(350, 350, 340, 5, 0.15);
                setValue("bp-conn-shape", "hexagon");
                setValue("bp-conn-size", 10);
                setValue("bp-conn-tol", 0.25);
                setChecked("bp-engrave", true);
                $("bp-format").value = "stl";
            };
            await enterBigPrint();
            setupBox();
            const t3b = performance.now();
            const solidBox = await runExport();
            const solidNames = solidBox.zip ? partNames(solidBox.zip) : [];
            const solidVols = new Map(solidNames.map((n) => [n, stlVolume(solidBox.zip[n])]));
            log(`B3b solid baseline ${Math.round(performance.now() - t3b)} ms, ${solidNames.length} parts`);
            check("B3b solid baseline: parts and the solid-parts wording",
                solidNames.length >= 2 && solidBox.toast.includes("solid parts")
                && textOf(solidBox.zip["manifest.txt"]).includes("Hollow: none (solid parts)"),
                `${solidNames.length} parts; ${solidBox.toast}`);
            $("bp-cancel").click();
            await waitFor(() => !CC.bigPrint.isActive(), 3000);
            await waitFor(() => settled($("action-dock")), 4000);
            await openPanel();
            setChecked("hollow-lamp", true); setChecked("hollow-lamp", false);
            setValue("hollow-wall", 6);
            await preview();
            await confirmAndSettle();
            check("B3b box hollow confirmed, no open faces",
                hstatus() === "confirmed" && CC.pieces[0].userData.hollow.wallMm === 6
                && !CC.pieces[0].userData.hollow.openFaces.some((f) => f.opened === true));
            await enterBigPrint();
            setupBox();
            const t3c = performance.now();
            const hollowBox = await runExport();
            const hollowNames = hollowBox.zip ? partNames(hollowBox.zip) : [];
            const ratios = hollowNames.map((n) => stlVolume(hollowBox.zip[n]) / solidVols.get(n));
            const manBox = hollowBox.zip ? textOf(hollowBox.zip["manifest.txt"]) : "";
            log(`B3b hollow export ${Math.round(performance.now() - t3c)} ms, ${hollowNames.length} parts, `
                + `ratios ${ratios.map((r) => r.toFixed(4)).join(", ")}`);
            check("B3b hollow box: same parts as the solid baseline, every one under 25% of its solid volume",
                hollowNames.length === solidNames.length && hollowNames.every((n) => solidVols.has(n))
                && ratios.length > 0 && ratios.every((r) => r > 0 && r < 0.25),
                `${hollowNames.length} parts; ratios ${ratios.map((r) => r.toFixed(4)).join(", ")}`);
            check("B3b manifest: wall and connectors",
                manBox.includes("Wall: 6 mm") && manBox.includes("Connectors: hexagon 10 mm, tolerance 0.25 mm"),
                manBox.split("\n").filter((l) => /Wall|Connectors:/.test(l)).join(" | "));
            check("B3b done toast says hollow, 6 mm wall", hollowBox.toast.includes("hollow, 6 mm wall"), hollowBox.toast);
            $("bp-cancel").click();
            await waitFor(() => !CC.bigPrint.isActive(), 3000);
            await waitFor(() => settled($("action-dock")), 4000);
            $("undo-btn").click();
            await waitFor(() => CC.pieces[0] === boxSolid, 4000);
            await enterBigPrint();
            setupBox();
            const soloBox = await runExport();
            check("B3b after undoing the hollow: solid parts wording in toast and manifest",
                soloBox.toast.includes("solid parts") && !soloBox.toast.includes("hollow, ")
                && !!soloBox.zip && textOf(soloBox.zip["manifest.txt"]).includes("Hollow: none (solid parts)"),
                soloBox.toast);
            $("bp-cancel").click();
            await waitFor(() => !CC.bigPrint.isActive(), 3000);

            // back to the 60 mm cube for B5-B8: hollow it again
            await hollowCube();
            await confirmAndSettle();
            const hollowC = CC.pieces[0];
            await enterBigPrint();

            // B5
            let revertEvents = 0;
            const onRevert = (e) => { if (e.detail && e.detail.source === "hollow-revert") revertEvents++; };
            win.addEventListener("curvecut:pieces-changed", onRevert);
            $("bp-cancel").click();
            await waitFor(() => !CC.bigPrint.isActive(), 3000);
            win.removeEventListener("curvecut:pieces-changed", onRevert);
            check("B5 exit keeps the hollow: same mesh, still confirmed, no revert event",
                !CC.bigPrint.isActive() && CC.pieces[0] === hollowC && hstatus() === "confirmed"
                && revertEvents === 0, `revert events ${revertEvents}`);
            await waitFor(() => settled($("action-dock")), 4000);

            // B6: simplify/repair copy userData onto a NEW mesh with new geometry
            CC.history.capture();
            const copy = new win.THREE.Mesh(hollowC.geometry.clone(), hollowC.material);
            Object.assign(copy.userData, hollowC.userData);
            CC.scene.remove(hollowC); CC.scene.add(copy); CC.pieces[0] = copy;
            win.dispatchEvent(new win.CustomEvent("curvecut:pieces-changed", { detail: { source: "simplify" } }));
            check("B6 copied receipt on new geometry is out-of-date", hstatus() === "out-of-date", String(hstatus()));
            $("bigprint-btn").click();
            await sleep(300);
            check("B6 Big Print refuses the out-of-date hollow",
                !CC.bigPrint.isActive() && toast().includes("changed after you confirmed it"), toast());
            $("undo-btn").click();
            await waitFor(() => CC.pieces[0] === hollowC, 4000);
            check("B6 undo brings the confirmed hollow back", hstatus() === "confirmed", String(hstatus()));

            // B7
            $("undo-btn").click();
            await waitFor(() => CC.pieces[0] !== hollowC, 4000);
            check("B7 undo again: solid, status none", hstatus() === "none", String(hstatus()));
            await enterBigPrint();
            await waitFor(() => visible("bigprint-panel") && settled($("bigprint-panel")), 3000);
            check("B7 solid model: Hollow… visible, note says solid",
                visible("bp-hollow-open") && $("bp-hollow-note").textContent.startsWith("Solid model."),
                $("bp-hollow-note").textContent);
            setValue("bp-scale", 2);
            $("bp-hollow-open").click();
            check("B7 scale 2: Hollow… refuses and stays in Big Print",
                CC.bigPrint.isActive() && toast().includes("Set Scale back to 1×"), toast());
            setValue("bp-scale", 1);
            $("bp-hollow-open").click();
            await waitFor(() => !CC.bigPrint.isActive() && visible("hollow-panel") && dockSettled(), 4000);
            await sleep(1200); // the exit's delayed dock fade-ins would show by now if they won
            check("B7 scale 1: Big Print closes, panel open, action dock and view dock hidden, as when opened from the main page",
                !CC.bigPrint.isActive() && visible("hollow-panel")
                && win.getComputedStyle($("action-dock")).visibility === "hidden"
                && !visible("view-dock") && CC.pieces[0].scale.x === 1 && CC.hollow.isOpen(),
                `active ${CC.bigPrint.isActive()}, panel ${visible("hollow-panel")}, dock ${win.getComputedStyle($("action-dock")).visibility}, `
                + `view dock ${visible("view-dock")}, scale ${CC.pieces[0].scale.x}, open ${CC.hollow.isOpen()}`);
            escape();
            await waitFor(() => !visible("hollow-panel") && visible("action-dock"), 4000);
            check("B7 Escape closes the panel, dock back", !visible("hollow-panel") && visible("action-dock"));

            // B8
            await openPanel();
            await waitFor(() => CC.cutFlow.isEngineReady(), 60000);
            captures.length = 0;
            $("hollow-glow-swatch").click();
            const swatch = captures[captures.length - 1];
            const swatchBytes = swatch ? await readCapture(swatch) : new Uint8Array(0);
            check("B8 glow swatch from the panel: one binary STL named glow-swatch.stl",
                captures.length === 1 && !!swatch && swatch.name === "glow-swatch.stl"
                && swatchBytes.length > 84 && (swatchBytes.length - 84) % 50 === 0,
                `${captures.length} captures, ${swatchBytes.length} bytes`);
            await waitFor(() => settled($("hollow-panel")), 3000); // closing mid-fade-in would leave the panel showing
            escape();
            await waitFor(() => dockSettled() && !visible("hollow-panel") && visible("action-dock"), 4000);

            // B9 (ticket 2): every Big Print field reachable at phone and tablet sizes
            for (const [fw, fh] of [[390, 844], [768, 1024]]) {
                frame.style.width = fw + "px"; frame.style.height = fh + "px";
                await sleep(400);
                await load(cube(), `cube${fw}`);
                await waitFor(() => visible("pieces-panel") && settled($("pieces-panel")) && settled($("action-dock")), 5000);
                const piecesBefore = visible("pieces-panel");
                // the visit popup can open by itself and would cover everything
                if (visible("donate-modal")) { $("donate-close").click(); await sleep(600); }
                await enterBigPrint();
                await waitFor(() => visible("bigprint-panel") && settled($("bigprint-panel")) && settled($("pieces-panel")), 4000);
                await waitFor(() => doc.querySelectorAll(".toast").length === 0, 8000);
                if (visible("donate-modal")) { $("donate-close").click(); await waitFor(() => !visible("donate-modal"), 3000); }
                const piecesYield = !visible("pieces-panel");
                const viewHidden = !visible("view-dock");
                const bad = [];
                const controls = [...doc.querySelectorAll("#bigprint-panel input, #bigprint-panel select, #bigprint-panel button")]
                    .filter((el) => el.getClientRects().length > 0 && win.getComputedStyle(el).visibility !== "hidden");
                for (const el of controls) {
                    el.scrollIntoView({ block: "center" });
                    const r = el.getBoundingClientRect();
                    const label = el.id || `${el.tagName.toLowerCase()}.${el.className}`;
                    if (r.left < -0.5 || r.right > win.innerWidth + 0.5) { bad.push(`${label} outside x ${Math.round(r.left)}..${Math.round(r.right)}`); continue; }
                    const hit = doc.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
                    if (!hit || !(hit === el || el.contains(hit))) {
                        bad.push(`${label} covered by ${hit ? (hit.id || hit.tagName.toLowerCase() + "." + hit.className) : "nothing (off screen)"}`);
                    }
                }
                check(`B9 ${fw}x${fh}: every Big Print control inside the frame and not covered (${controls.length} checked)`,
                    bad.length === 0, bad.join("; "));
                check(`B9 ${fw}x${fh}: Cancel and Cut & Export among them`,
                    controls.includes($("bp-cancel")) && controls.includes($("bp-export")));
                check(`B9 ${fw}x${fh}: Pieces panel yields to Big Print`, piecesBefore && piecesYield,
                    `before ${piecesBefore}, hidden in Big Print ${piecesYield}`);
                if (fw <= 768) check(`B9 ${fw}x${fh}: view dock hidden while Big Print is active`, viewHidden);
                setValue("bp-size", 120);
                check(`B9 ${fw}x${fh}: typed Size took`,
                    $("bp-size").value === "120" && Math.abs(CC.pieces[0].scale.x - 2) < 1e-9,
                    `${$("bp-size").value} / scale ${CC.pieces[0].scale.x}`);
                $("bp-cancel").click();
                await waitFor(() => !CC.bigPrint.isActive() && settled($("pieces-panel")) && settled($("view-dock")), 4000);
                check(`B9 ${fw}x${fh}: Pieces panel and view dock come back after Cancel`,
                    await waitFor(() => visible("pieces-panel") && visible("view-dock"), 3000));
            }
            frame.style.width = ""; frame.style.height = "";
            await sleep(300);

            // B10: loading another model while a panel is open must not leave the Pieces panel hidden
            await load(cube(), "cube10");
            await waitFor(() => visible("pieces-panel") && settled($("pieces-panel")) && settled($("action-dock")), 5000);
            await enterBigPrint();
            await waitFor(() => !visible("pieces-panel") && settled($("pieces-panel")), 4000);
            await load(cube(), "cube10b");
            await waitFor(() => !CC.bigPrint.isActive(), 4000);
            await sleep(1500);
            check("B10 new model loaded while Big Print is open: Pieces panel is back", visible("pieces-panel") && CC.pieces.length === 1);
            await waitFor(() => settled($("action-dock")) && visible("action-dock"), 4000);
            await openPanel();
            await waitFor(() => !visible("pieces-panel") && settled($("hollow-panel")), 4000);
            await load(cube(), "cube10c");
            await sleep(1500);
            check("B10 new model loaded while the Hollow panel is open: panel closed, Pieces panel is back",
                !visible("hollow-panel") && visible("pieces-panel") && visible("action-dock") && visible("view-dock"),
                `panel ${visible("hollow-panel")}, pieces ${visible("pieces-panel")}, dock ${visible("action-dock")}, view ${visible("view-dock")}`);

            // B11: the recorded solid shape must survive a Big Print scale bake on the solid model
            await hollowCube();
            await confirmAndSettle();
            await waitFor(() => settled($("action-dock")), 4000);
            const hollow11 = CC.pieces[0];
            $("undo-btn").click();
            await waitFor(() => CC.pieces[0] !== hollow11, 4000);
            await enterBigPrint();
            setValue("bp-scale", 2);
            const e11 = await runExport();
            $("bp-cancel").click();
            await waitFor(() => !CC.bigPrint.isActive(), 4000);
            await waitFor(() => settled($("action-dock")), 4000);
            $("redo-btn").click();
            await waitFor(() => CC.pieces[0] === hollow11, 4000);
            const solid11 = CC.hollow.solidGeometry();
            let size11 = "none";
            if (solid11) { solid11.computeBoundingBox(); const v = new win.THREE.Vector3(); solid11.boundingBox.getSize(v); size11 = v.x.toFixed(2); }
            check("B11 scale bake on the solid model leaves the recorded solid shape at 60", !!e11.result && size11 === "60.00",
                `export ${!!e11.result}, solid width ${size11}`);
        } catch (error) {
            check("test harness did not throw", false, String(error && error.stack || error));
        }
        document.title = fails.length ? "FAIL: " + fails.join(", ") : "PASS";
    })();
})();
</script>
</body>
</html>
