<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RUNNING</title>
</head>
<body>
<pre id="log"></pre>
<script src="../vendor/three/three.min.js"></script>
<script src="../vendor/manifold/manifold.wasm.b64.js"></script>
<script src="../vendor/manifold/manifold.js"></script>
<script src="../vendor/hershey/hershey-font.js"></script>
<script src="../js/cut-core.js"></script>
<script src="../js/hollow-core.js"></script>
<script src="../js/lamp-core.js"></script>
<script>
/* Headless test for the hybrid hollowing engine. Run via tools/check_hollow.py.
   Result lands in document.title: "PASS" or "FAIL: <reason>". */
(async () => {
    "use strict";

    const log = (message) => { document.getElementById("log").textContent += message + "\n"; };
    const failures = [];
    const check = (name, condition, detail) => {
        log(`${condition ? "ok  " : "FAIL"} ${name}${detail ? " — " + detail : ""}`);
        if (!condition) failures.push(name);
    };
    const dispose = (value) => { if (value) value.delete(); };
    const statusOk = (manifold) => String(manifold.status()) === "NoError";
    const warningCodes = (result) => result.stats.warnings.map((warning) => warning.code);

    // FNV-1a over typed arrays, plain arrays and numbers, fed in order.
    function makeDigest() {
        let hash = 0x811c9dc5;
        return {
            add(...parts) {
                for (const part of parts) {
                    const view = typeof part === "number" ? new Uint32Array([part])
                        : Array.isArray(part) ? Uint32Array.from(part) : part;
                    const bytes = new Uint8Array(view.buffer, view.byteOffset, view.byteLength);
                    for (let i = 0; i < bytes.length; i++) hash = Math.imul(hash ^ bytes[i], 0x01000193) >>> 0;
                }
            },
            hex: () => hash.toString(16).padStart(8, "0"),
        };
    }
    const fanDigest = makeDigest();

    function checkGridFans(H) {
        const spec = { dims: [5, 5, 5], min: [0, 0, 0], h: 3, wall: 6 };
        const control = { check() {}, progress() {} }, values = [0, 3.9, 5.9, 9];
        const fixed = [9, 3.9, 3.9, 9, 9, 5.9, 5.9, 3.9, 3.9, 9, 3.9, 3.9];
        const audit = (block) => {
            const grid = new Float32Array(125);
            let i = 0;
            for (let z = 1; z <= 3; z++) for (let y = 1; y <= 2; y++) for (let x = 1; x <= 2; x++) {
                grid[x + 5 * y + 25 * z] = block[i++];
            }
            const marched = H._test.marchGrid(grid, spec, control);
            const result = H._test.orientMesh(marched, control);
            fanDigest.add(result.boundaryPairs, result.overused, result.conflicts, marched.triVerts);
            return result;
        };
        const soup = { vertices: 6, triVerts: new Uint32Array([
            0, 1, 2, 1, 0, 3, 0, 1, 4, 1, 0, 5,
        ]), misorientedEdges: 0 };
        let auditError = "";
        try { H._test.auditGridMesh(soup, control); } catch (error) { auditError = error.message; }
        check("grid audit rejects four uses with zero misorientation",
            auditError === "grid mesh audit failed: overused=1, conflicts=0", auditError);
        // With 10 grid nodes the old lo * 10 + hi gives 12 for both edges.
        check("grid edge keys distinguish vertices beyond node count",
            H._test.edgeKey(0, 12) !== H._test.edgeKey(1, 2));
        const clean = (result) => result.overused === 0 && result.conflicts === 0;
        const fixedResult = audit(fixed);
        check("grid fan fixed checkerboard", clean(fixedResult),
            `overused=${fixedResult.overused}, conflicts=${fixedResult.conflicts}`);
        let failed = 0;
        for (let seed = 0; seed < 3000; seed++) {
            let state = seed;
            const block = Array.from({ length: 12 }, () => {
                state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
                return values[state >>> 30];
            });
            if (!clean(audit(block))) failed++;
        }
        check("grid fan 3000 seeded blocks", failed === 0, `${failed} failed`);
    }

    function manifoldFromArrays(wasm, vertProperties, triVerts) {
        const mesh = new wasm.Mesh({ numProp: 3, vertProperties, triVerts });
        mesh.merge();
        return new wasm.Manifold(mesh);
    }

    function refinedIcosphere(wasm, radius, subdivisions, zScale = 1) {
        const golden = (1 + Math.sqrt(5)) / 2;
        const vertices = [
            [-1, golden, 0], [1, golden, 0], [-1, -golden, 0], [1, -golden, 0],
            [0, -1, golden], [0, 1, golden], [0, -1, -golden], [0, 1, -golden],
            [golden, 0, -1], [golden, 0, 1], [-golden, 0, -1], [-golden, 0, 1],
        ].map((point) => {
            const length = Math.hypot(point[0], point[1], point[2]);
            return [point[0] / length, point[1] / length, point[2] / length];
        });
        let faces = [
            [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
            [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
            [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
            [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1],
        ];
        for (let level = 0; level < subdivisions; level++) {
            const midpointCache = new Map(), next = [];
            const midpoint = (a, b) => {
                const key = a < b ? `${a},${b}` : `${b},${a}`;
                let index = midpointCache.get(key);
                if (index !== undefined) return index;
                const point = [(vertices[a][0] + vertices[b][0]) / 2,
                    (vertices[a][1] + vertices[b][1]) / 2,
                    (vertices[a][2] + vertices[b][2]) / 2];
                const length = Math.hypot(point[0], point[1], point[2]);
                index = vertices.length;
                vertices.push([point[0] / length, point[1] / length, point[2] / length]);
                midpointCache.set(key, index);
                return index;
            };
            for (const face of faces) {
                const ab = midpoint(face[0], face[1]);
                const bc = midpoint(face[1], face[2]);
                const ca = midpoint(face[2], face[0]);
                next.push([face[0], ab, ca], [face[1], bc, ab],
                    [face[2], ca, bc], [ab, bc, ca]);
            }
            faces = next;
        }
        const positions = new Float32Array(vertices.length * 3);
        for (let i = 0; i < vertices.length; i++) {
            positions[i * 3] = vertices[i][0] * radius;
            positions[i * 3 + 1] = vertices[i][1] * radius;
            positions[i * 3 + 2] = vertices[i][2] * radius * zScale;
        }
        return manifoldFromArrays(wasm, positions, new Uint32Array(faces.flat()));
    }

    function subtractAll(base, cutters) {
        let current = base;
        try {
            for (const cutter of cutters) {
                const next = current.subtract(cutter);
                if (current !== base) current.delete();
                current = next;
            }
            base.delete();
            return current;
        } catch (error) {
            if (current !== base) current.delete();
            base.delete();
            throw error;
        } finally {
            for (const cutter of cutters) cutter.delete();
        }
    }

    function translated(manifold, offset) {
        try {
            return manifold.translate(offset);
        } finally {
            manifold.delete();
        }
    }

    function cavityIsOpen(wasm, hollow, center) {
        let probe = null, overlap = null;
        try {
            probe = translated(wasm.Manifold.cube([2, 2, 2], true), center);
            overlap = hollow.intersect(probe);
            return overlap.volume() < 1e-6;
        } finally {
            dispose(overlap); dispose(probe);
        }
    }

    function checkGlowSwatch(wasm) {
        const steps = [1.2, 1.6, 2.4, 3.2, 4.0, 6.0];
        check("glow swatch steps", JSON.stringify(LampCore.SWATCH_STEPS) === JSON.stringify(steps));
        let geometry = null, solid = null, labels = null;
        try {
            geometry = LampCore.buildGlowSwatch(window.HERSHEY_FONT);
            solid = CutCore.toManifold(geometry);
            const parts = solid.decompose();
            check("glow swatch watertight one piece", statusOk(solid) && parts.length === 1);
            parts.forEach(dispose);
            const bounds = solid.boundingBox();
            const size = bounds.max.map((value, i) => value - bounds.min[i]);
            check("glow swatch dimensions", size.every((value, i) => Math.abs(value - [236, 34, 60][i]) < 0.1), size.join(", "));
            for (let i = 0; i < steps.length; i++) {
                const x = -118 + 8 + 15 + i * 38;
                const slab = translated(wasm.Manifold.cube([0.2, 20, 60], true), [x, 20, 0]);
                const intersection = solid.intersect(slab);
                const box = intersection.boundingBox();
                const thickness = box.max[2] - box.min[2];
                check(`glow swatch fin ${steps[i].toFixed(1)}`, Math.abs(thickness - steps[i]) < 0.02, `${thickness}`);
                dispose(intersection); dispose(slab);
            }
            const abovePlate = translated(wasm.Manifold.cube([236, 31, 60], true), [0, 19.5, 0]);
            labels = solid.intersect(abovePlate);
            dispose(abovePlate);
            for (let i = 0; i < steps.length; i++) {
                const x = -118 + 8 + 15 + i * 38;
                const footprint = translated(wasm.Manifold.cube([30.2, 31, steps[i] + 0.2], true) /* 0.1 mm larger each side: no coplanar slivers */, [x, 19.5, 0]);
                const next = labels.subtract(footprint);
                dispose(labels); dispose(footprint); labels = next;
            }
            const labelTop = labels.boundingBox().max[1];
            check("glow swatch raised labels", labels.volume() > 0 && Math.abs(labelTop - 4.8) < 0.05,
                `volume=${labels.volume()}, top=${labelTop}`);
        } finally {
            dispose(labels); dispose(solid);
            if (geometry) geometry.dispose();
        }
    }

    function probeVolume(wasm, result, min, max) {
        let probe = null, overlap = null;
        try {
            probe = translated(wasm.Manifold.cube(
                [max[0] - min[0], max[1] - min[1], max[2] - min[2]], true),
                [(min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2]);
            overlap = result.intersect(probe);
            return overlap.volume();
        } finally {
            dispose(overlap); dispose(probe);
        }
    }

    // Digest over the bytes of toArrays(result.hollow): vertProperties, then triVerts.
    function fnvDigest(H, manifold) {
        const arrays = H.toArrays(manifold);
        let hash = 0x811c9dc5;
        for (const view of [arrays.vertProperties, arrays.triVerts]) {
            const bytes = new Uint8Array(view.buffer, view.byteOffset, view.byteLength);
            for (let i = 0; i < bytes.length; i++) hash = Math.imul(hash ^ bytes[i], 0x01000193) >>> 0;
        }
        return hash.toString(16).padStart(8, "0");
    }

    /* Counts live Manifold / CrossSection objects: wraps every method that can hand one
       back (and their delete), so a leak shows as a larger live count. Restore when done. */
    function trackLive(wasm, sample) {
        const live = new Map(), restore = [];
        const isObj = (v) => !!v && typeof v === "object" && typeof v.delete === "function";
        let currentName = "";
        const register = (value) => {
            if (Array.isArray(value)) value.forEach(register);
            else if (isObj(value)) live.set(value, currentName);
            return value;
        };
        const patch = (target) => {
            for (const name of Object.getOwnPropertyNames(target)) {
                const original = Object.getOwnPropertyDescriptor(target, name);
                if (!original || typeof original.value !== "function" || name === "constructor") continue;
                const skipResult = name === "getMesh" || name.startsWith("_"); // Mesh is a plain JS copy; vendored Manifold's CrossSection.extrude never deletes its _ToPolygons vector — a small known library leak per extrude (vendor/ unchanged; see PR)
                const fn = original.value;
                let wrapped;
                if (name === "delete") {
                    wrapped = function(...args) { live.delete(this); return fn.apply(this, args); };
                } else {
                    wrapped = function(...args) {
                        currentName = name;
                        const out = fn.apply(this, args);
                        return skipResult ? out : register(out);
                    };
                }
                try {
                    Object.defineProperty(target, name, { ...original, value: wrapped });
                    restore.push(() => Object.defineProperty(target, name, original));
                } catch (_) { /* non-configurable: skip */ }
            }
        };
        const section = sample.slice(0);
        const sectionProto = Object.getPrototypeOf(section);
        section.delete();
        const chain = (proto) => { // embind keeps delete() on a base class further up the chain
            for (let at = proto; at && at !== Object.prototype; at = Object.getPrototypeOf(at)) patch(at);
        };
        chain(Object.getPrototypeOf(sample));
        if (sectionProto) chain(sectionProto);
        patch(wasm.Manifold);
        return { count: () => live.size, names: () => [...live.values()].join(","), stop: () => restore.reverse().forEach((undo) => undo()) };
    }

    function checkOpenFacesAndHoles(wasm, H, cube) {
        const GOLDEN_MESH = "330ce2e5"; // recorded on unchanged main
        const GOLDEN_GRID = "ec639066"; // recorded on unchanged main
        const SEGMENTS = H._test.HOLE_SEGMENTS;
        const ngonArea = (r) => 0.5 * SEGMENTS * r * r * Math.sin(2 * Math.PI / SEGMENTS);
        const near = (a, b, tol) => Math.abs(a - b) <= tol;
        const run = (source, wall, opts) => {
            const result = H.hollow(source, wall, opts);
            ownedResults.push(result.hollow);
            return result;
        };
        const pieces = (manifold) => {
            const parts = manifold.decompose();
            const count = parts.length;
            parts.forEach(dispose);
            return count;
        };
        const column = (result, lo, hi, half = 0.5) =>
            probeVolume(wasm, result, [-half, lo, -half], [half, hi, half]);
        const bottomRing = (result) =>
            probeVolume(wasm, result, [-31, -29.55, -31], [31, -29.45, 31]);
        const throwsWith = (name, expectedType, message, fn) => {
            let got = "";
            try { fn(); } catch (error) { got = `${error.constructor.name}: ${error.message}`; }
            check(name, got === `${expectedType.name}: ${message}`, got);
        };
        const dir = (x, y, z) => ({ x, y, z });
        const hole = (overrides) => Object.assign({
            point: dir(0, 30, 0), direction: dir(0, -1, 0), diameterMm: 6, depthMm: 3,
        }, overrides);

        // T1 open bottom, mesh
        const t1 = run(cube, 6, { openFaces: ["bottom"] });
        const f1 = (t1.stats.openFaces || [])[0] || {};
        check("T1 open bottom mesh engine + volume", t1.stats.engineUsed === "mesh"
            && near(t1.stats.volumeAfterMm3, 91584, 1e-3), `${t1.stats.engineUsed} ${t1.stats.volumeAfterMm3}`);
        check("T1 watertight one piece", statusOk(t1.hollow) && pieces(t1.hollow) === 1);
        check("T1 ring 0.5 mm above bottom", near(bottomRing(t1.hollow), 129.6, 0.01)
            && cavityIsOpen(wasm, t1.hollow, [0, -29.5, 0]), `${bottomRing(t1.hollow)}`);
        check("T1 ray up from below is clear to the ceiling",
            column(t1.hollow, -40, 23.9) < 1e-6 && column(t1.hollow, -40, 24.5) > 0,
            `${column(t1.hollow, -40, 23.9)} / ${column(t1.hollow, -40, 24.5)}`);
        check("T1 face fact", f1.label === "Bottom" && f1.opened === true
            && near(f1.normal.x, 0, 1e-9) && near(f1.normal.y, -1, 1e-9) && near(f1.normal.z, 0, 1e-9)
            && near(f1.openedAreaMm2, 2304, 1e-3), JSON.stringify(f1));
        check("T1 removed volume and no warnings", near(t1.stats.openFacesRemovedMm3, 13824, 1e-3)
            && t1.stats.warnings.length === 0, `${t1.stats.openFacesRemovedMm3} ${warningCodes(t1)}`);

        // T2 open bottom, grid
        const t2 = run(cube, 6, { engine: "grid", openFaces: ["bottom"] });
        const ring2 = bottomRing(t2.hollow);
        let band = null, bandHit = null, minY = NaN;
        try {
            band = translated(wasm.Manifold.cube([1, 80, 1], true), [0, 0, 0]);
            bandHit = t2.hollow.intersect(band);
            minY = bandHit.boundingBox().min[1];
        } finally { dispose(bandHit); dispose(band); }
        check("T2 open bottom grid", statusOk(t2.hollow) && pieces(t2.hollow) === 1
            && Math.abs(ring2 - 129.6) / 129.6 < 0.03 && column(t2.hollow, -40, 20) < 1e-6
            && minY >= 20 && minY <= 26, `ring=${ring2} minY=${minY}`);

        // T3 neck guard
        let neck = null, head = null, stepped = null;
        try {
            neck = translated(wasm.Manifold.cube([20, 30, 20], true), [0, 15, 0]);
            head = translated(wasm.Manifold.cube([60, 30, 60], true), [0, 45, 0]);
            stepped = neck.add(head);
            const t3 = run(stepped, 4, { openFaces: ["bottom"] });
            const wallProbe = probeVolume(wasm, t3.hollow, [7.5, 0, -0.5], [8.5, 1, 0.5]);
            const floorProbe = probeVolume(wasm, t3.hollow, [14.5, 31.5, -0.5], [15.5, 32.5, 0.5]);
            check("T3 neck guard keeps neck wall and head floor", statusOk(t3.hollow)
                && pieces(t3.hollow) === 1 && wallProbe > 0 && floorProbe > 0
                && column(t3.hollow, -5, 50) < 1e-6 && !warningCodes(t3).includes("open-face-thin-rim"),
                `wall=${wallProbe} floor=${floorProbe} ${warningCodes(t3)}`);
        } finally { dispose(stepped); dispose(head); dispose(neck); }

        // T4 blind hole. A sealed cavity counts as its own mesh component in decompose(),
        // so a blind hole keeps the same piece count as the plain hollow cube (2).
        const t4 = run(cube, 6, { holes: [hole()] });
        const removed4 = ngonArea(3) * 3;
        const plainPieces = pieces(run(cube, 6, {}).hollow);
        check("T4 blind hole", near(t4.stats.volumeAfterMm3, 105408 - removed4, 1e-3)
            && t4.stats.holes && t4.stats.holes.count === 1
            && near(t4.stats.holes.removedMm3, removed4, 1e-3)
            && statusOk(t4.hollow) && pieces(t4.hollow) === plainPieces,
            `${t4.stats.volumeAfterMm3} ${JSON.stringify(t4.stats.holes)} pieces=${pieces(t4.hollow)} plain=${plainPieces}`);

        // T5 hole into the cavity
        const t5 = run(cube, 6, { holes: [hole({ depthMm: 10 })] });
        check("T5 hole into cavity", t5.stats.holes && near(t5.stats.holes.removedMm3, ngonArea(3) * 6, 1e-3)
            && column(t5.hollow, 0, 31) < 1e-6 && statusOk(t5.hollow) && pieces(t5.hollow) === 1,
            `${t5.stats.holes && t5.stats.holes.removedMm3}`);

        // T6 rotated holes
        const t6 = run(cube, 6, { holes: [
            hole({ point: dir(30, 0, 0), direction: dir(-1, 0, 0) }),
            hole({ point: dir(0, 0, -30), direction: dir(0, 0, 1) }),
        ] });
        const small = (c) => probeVolume(wasm, t6.hollow,
            [c[0] - 0.25, c[1] - 0.25, c[2] - 0.25], [c[0] + 0.25, c[1] + 0.25, c[2] + 0.25]);
        check("T6 two rotated holes", t6.stats.holes && near(t6.stats.holes.removedMm3, 2 * ngonArea(3) * 3, 1e-3)
            && small([28.5, 0, 0]) < 1e-6 && small([0, 0, -28.5]) < 1e-6 && small([28.5, 0, 10]) > 0.1,
            `${t6.stats.holes && t6.stats.holes.removedMm3} ${small([28.5, 0, 0])} ${small([0, 0, -28.5])} ${small([28.5, 0, 10])}`);

        // T7 open bottom plus hole
        const t7 = run(cube, 6, { openFaces: ["bottom"], holes: [hole()] });
        check("T7 open bottom and hole", near(t7.stats.volumeAfterMm3, 91584 - removed4, 1e-3)
            && statusOk(t7.hollow) && pieces(t7.hollow) === 1, `${t7.stats.volumeAfterMm3}`);

        // T8 explicit plane, thin rim
        let cone = null;
        try {
            cone = wasm.Manifold.cylinder(20, 10, 40, 64);
            const t8 = run(cone, 4, { openFaces: [{ point: dir(0, 0, 0), normal: dir(0, 0, -1) }] });
            const f8 = (t8.stats.openFaces || [])[0] || {};
            check("T8 cone thin rim warns", statusOk(t8.hollow) && warningCodes(t8).includes("open-face-thin-rim")
                && f8.label === "Face 1" && f8.opened === true, `${warningCodes(t8)} ${JSON.stringify(f8)}`);
        } finally { dispose(cone); }

        // T9 no cavity in reach
        const t9 = run(cube, 6, { openFaces: [{ point: dir(0, -40, 0), normal: dir(0, -1, 0) }] });
        const f9 = (t9.stats.openFaces || [])[0] || {};
        check("T9 no cavity in reach", warningCodes(t9).includes("open-face-no-cavity")
            && near(t9.stats.volumeAfterMm3, 105408, 1e-6) && f9.opened === false,
            `${warningCodes(t9)} ${t9.stats.volumeAfterMm3}`);

        // T10 validation messages
        const bad = (opts) => () => H.hollow(cube, 6, opts);
        throwsWith("T10 openFaces not a list", TypeError, "Open faces must be a list.", bad({ openFaces: "bottom" }));
        throwsWith("T10 open face junk", TypeError, 'Open face 2 needs a point and a direction, or "bottom".',
            bad({ openFaces: ["bottom", 5] }));
        throwsWith("T10 open face missing normal", TypeError, 'Open face 1 needs a point and a direction, or "bottom".',
            bad({ openFaces: [{ point: dir(0, 0, 0) }] }));
        throwsWith("T10 open face no direction", RangeError, "Open face 1 has no direction.",
            bad({ openFaces: [{ point: dir(0, 0, 0), normal: dir(0, 0, 0) }] }));
        throwsWith("T10 holes not a list", TypeError, "Holes must be a list.", bad({ holes: {} }));
        throwsWith("T10 hole missing", TypeError, "Hole 2 needs a point and a direction.",
            bad({ holes: [hole(), {}] }));
        throwsWith("T10 hole non-finite point", TypeError, "Hole 1 needs a point and a direction.",
            bad({ holes: [hole({ point: dir(NaN, 0, 0) })] }));
        throwsWith("T10 hole no direction", RangeError, "Hole 1 has no direction.",
            bad({ holes: [hole({ direction: dir(0, 0, 0) })] }));
        throwsWith("T10 hole diameter", RangeError, "Hole 1 needs a diameter above 0 mm.",
            bad({ holes: [hole({ diameterMm: 0 })] }));
        throwsWith("T10 hole diameter NaN", RangeError, "Hole 1 needs a diameter above 0 mm.",
            bad({ holes: [hole({ diameterMm: NaN })] }));
        throwsWith("T10 hole depth", RangeError, "Hole 1 needs a depth above 0 mm.",
            bad({ holes: [hole({ depthMm: -1 })] }));

        // T11 cancel between two open faces: the error path must free the half-cut hollow
        for (const engine of ["mesh", "grid"]) {
            const live = trackLive(wasm, cube);
            let cancelAtSecond = false, cancelled = false, liveBefore = -1, liveAfter = -2, liveNames = "";
            try {
                liveBefore = live.count();
                try {
                    H.hollow(cube, 6, {
                        engine,
                        openFaces: ["bottom", { point: dir(0, -30, 0), normal: dir(0, -1, 0) }],
                        onProgress: (stage, fraction) => {
                            if (stage === "open-faces" && fraction === 0.5) cancelAtSecond = true;
                        },
                        shouldCancel: () => cancelAtSecond,
                    });
                } catch (error) {
                    cancelled = error instanceof H.HollowCancelled;
                }
                liveAfter = live.count(); liveNames = live.names();
            } finally { live.stop(); }
            const afterCancel = run(cube, 6, {});
            check(`T11 cancel between faces (${engine})`, cancelAtSecond && cancelled
                && near(afterCancel.stats.volumeAfterMm3, 105408, 1e-6), `${cancelAtSecond} ${cancelled}`);
            check(`T11 cancel leaks nothing (${engine})`, liveBefore === liveAfter,
                `${liveBefore} vs ${liveAfter} (${liveNames})`);
        }

        // T12 identity guard
        const plain = run(cube, 6, {}), empty = run(cube, 6, { openFaces: [], holes: [] });
        const a = H.toArrays(plain.hollow), b = H.toArrays(empty.hollow);
        const sameBytes = a.vertProperties.length === b.vertProperties.length
            && a.triVerts.length === b.triVerts.length
            && a.vertProperties.every((v, i) => v === b.vertProperties[i])
            && a.triVerts.every((v, i) => v === b.triVerts[i]);
        const meshDigest = fnvDigest(H, plain.hollow);
        const gridDigest = fnvDigest(H, run(cube, 6, { engine: "grid" }).hollow);
        log(`digests: mesh=${meshDigest} grid=${gridDigest}`);
        check("T12 empty lists change nothing", sameBytes);
        check("T12 golden digests", meshDigest === GOLDEN_MESH && gridDigest === GOLDEN_GRID,
            `${meshDigest} ${gridDigest}`);
        check("T12 empty stats", !!plain.stats.holes && plain.stats.holes.count === 0
            && plain.stats.holes.removedMm3 === 0 && Array.isArray(plain.stats.openFaces)
            && plain.stats.openFaces.length === 0 && empty.stats.openFaces.length === 0);

        // T13 two separate cavities with floors at different heights (raised foot)
        let footA = null, footB = null, feet = null;
        try {
            footA = translated(wasm.Manifold.cube([20, 30, 20], true), [-15, 15, 0]);
            footB = translated(wasm.Manifold.cube([20, 30, 20], true), [15, 18, 0]);
            feet = footA.add(footB);
            const t13 = run(feet, 3, { openFaces: ["bottom"] });
            const probeA = probeVolume(wasm, t13.hollow, [-15.5, -5, -0.5], [-14.5, 25, 0.5]);
            const probeB = probeVolume(wasm, t13.hollow, [14.5, -5, -0.5], [15.5, 25, 0.5]);
            check("T13 both cavities open from below", statusOk(t13.hollow) && pieces(t13.hollow) === 2
                && probeA < 1e-6 && probeB < 1e-6 && t13.stats.openFaces[0].opened === true
                && !warningCodes(t13).includes("open-face-partial"),
                `A=${probeA} B=${probeB} pieces=${pieces(t13.hollow)} ${warningCodes(t13)}`);
        } finally { dispose(feet); dispose(footB); dispose(footA); }

        // T14 plane just off the model: no rim warning from an empty slice
        const t14 = run(cube, 6, { openFaces: [{ point: dir(0, -35, 0), normal: dir(0, -1, 0) }] });
        check("T14 plane off the model gives no rim warning", t14.stats.openFaces[0].opened === true
            && !warningCodes(t14).includes("open-face-thin-rim"), `${warningCodes(t14)}`);

        // T15 a hole that misses the model is reported and not counted
        const t15 = run(cube, 6, { holes: [hole(), hole({ point: dir(100, 100, 100) })] });
        const miss = t15.stats.warnings.find((w) => w.code === "hole-missed");
        check("T15 missed hole warns and is not counted", !!miss
            && miss.detail === "Hole 2 doesn't touch the model; nothing was drilled."
            && t15.stats.holes.count === 1 && near(t15.stats.holes.removedMm3, removed4, 1e-3),
            `${JSON.stringify(t15.stats.holes)} ${miss && miss.detail}`);

        // T16 cavity narrowing upward: the opening thins the side wall
        let funnel = null;
        try {
            funnel = wasm.Manifold.cylinder(30, 25, 5, 64);
            const t16 = run(funnel, 4, { openFaces: [{ point: dir(0, 0, 0), normal: dir(0, 0, -1) }] });
            const side = t16.stats.warnings.find((w) => w.code === "open-face-thin-side");
            check("T16 thin side warns", statusOk(t16.hollow) && !!side
                && side.detail === "Open face 1 (Face 1): the opening thins the side wall near this face; check the section view.",
                `${warningCodes(t16)}`);
        } finally { dispose(funnel); }

        // T17 pocket shallower than the band: no false thin-side warning
        let plate = null;
        try {
            plate = wasm.Manifold.cube([30, 7, 30], true);
            const t17 = run(plate, 3, { openFaces: ["bottom"] });
            check("T17 shallow pocket has no thin-side warning", statusOk(t17.hollow)
                && t17.stats.openFaces[0].opened === true && !warningCodes(t17).includes("open-face-thin-side"),
                `${warningCodes(t17)}`);
        } finally { dispose(plate); }
    }

    // The raw marched mesh of a source, the same steps as runGrid up to the march.
    function rawMarch(H, manifold, wall) {
        const arrays = H.toArrays(manifold), control = { check() {}, progress() {} };
        const spec = H._test.gridSpec(arrays, wall);
        spec.wall = wall;
        const grid = new Float32Array(spec.voxels);
        H._test.columnSignPass(arrays, spec, grid, control);
        H._test.exactBandPass(arrays, spec, grid, control);
        return H._test.marchGrid(grid, spec, control);
    }

    // T18: byte-identical audit on the existing fixtures.
    function checkRawAuditGoldens(wasm, H) {
        // recorded on unchanged main d8571e0
        const GOLDEN = { G1: ["8a597727", "d24a4093"], G2: ["9d2a9fe7", "70b04a8f"],
            G3: ["811c9dc5", "9be17165"], G4: ["ad054948", "e2d8719a"], G3b: ["5753a65e", "7eda34a0"], G5: "ed10a2dd" };
        const control = { check() {}, progress() {} };
        const digestOf = (marched) => {
            const first = makeDigest();
            first.add(marched.vertProperties, marched.triVerts);
            const reference = { vertices: marched.vertices, triVerts: marched.triVerts.slice() };
            const oriented = H._test.orientMesh(reference, control);
            const audited = { vertices: marched.vertices, triVerts: marched.triVerts.slice() };
            H._test.auditGridMesh(audited, control);
            const second = makeDigest();
            second.add(audited.triVerts, oriented.boundaryPairs, oriented.overused, oriented.conflicts);
            return [first.hex(), second.hex()];
        };
        const got = {};
        let cavitySource = null, flat = null, round = null;
        try {
            got.G1 = digestOf(rawMarch(H, cube, 6));
            round = refinedIcosphere(wasm, 20, 6);
            got.G2 = digestOf(rawMarch(H, round, 6));
            flat = refinedIcosphere(wasm, 20, 6, 0.2);
            got.G3 = digestOf(rawMarch(H, flat, 6));
            // G3 at wall 6 marches to an empty mesh (the sphere is only 8 mm thick), so G3b
            // repeats it with a wall that leaves an inner surface.
            got.G3b = digestOf(rawMarch(H, flat, 2));
            const first = translated(wasm.Manifold.sphere(6, 24), [-12, 0, 0]);
            const second = translated(wasm.Manifold.sphere(6, 24), [12, 0, 0]);
            cavitySource = subtractAll(wasm.Manifold.cube([60, 40, 40], true), [first, second]);
            got.G4 = digestOf(rawMarch(H, cavitySource, 2));
        } finally { dispose(cavitySource); dispose(flat); dispose(round); }
        got.G5 = fanDigest.hex();
        log("raw audit digests: " + JSON.stringify(got));
        const same = Object.keys(GOLDEN).every((name) =>
            JSON.stringify(got[name]) === JSON.stringify(GOLDEN[name]));
        check("T18 raw grid audit identical to main (G1-G5)", same, JSON.stringify(got));
    }

    let wasm, cube, refined, thinRefined;
    const ownedResults = [];
    try {
        wasm = await CutCore.init();
        checkGlowSwatch(wasm);
        const H = window.CurveCut.hollowCore;
        check("core API", !!(H && H.hollow && H.estimate && H.previewShell && H.wallWarnings));
        checkGridFans(H);

        cube = wasm.Manifold.cube([60, 60, 60], true);
        check("cube fixture has 12 triangles", cube.numTri() === 12, `${cube.numTri()} triangles`);
        const cubeMesh = cube.getMesh();
        const preview = H.previewShell(cube, 6);
        const span = (values, axis) => {
            let lo = Infinity, hi = -Infinity;
            for (let i = axis; i < values.length; i += 3) {
                lo = Math.min(lo, values[i]); hi = Math.max(hi, values[i]);
            }
            return hi - lo;
        };
        const previewWallStats = (displacementsMm) => {
            const values = Array.from(displacementsMm).sort((a, b) => a - b);
            const pick = (fraction) => values[Math.floor(fraction * (values.length - 1))];
            return { minMm: values[0], p05Mm: pick(0.05), medianMm: pick(0.5) };
        };
        check("preview shell keeps one vertex per source vertex",
            preview.vertProperties.length === cubeMesh.vertProperties.length,
            `${preview.vertProperties.length / 3} vertices`);
        check("preview shell keeps source topology",
            preview.triVerts.length === cubeMesh.triVerts.length
            && preview.triVerts.every((value, i) => value === cubeMesh.triVerts[i]));
        check("preview shell is displaced inward",
            span(preview.vertProperties, 0) < span(cubeMesh.vertProperties, 0)
            && span(preview.vertProperties, 1) < span(cubeMesh.vertProperties, 1)
            && span(preview.vertProperties, 2) < span(cubeMesh.vertProperties, 2));
        check("preview is QEF arrays only — no Manifold boolean result",
            preview.vertProperties instanceof Float32Array
            && preview.triVerts instanceof Uint32Array
            && typeof preview.subtract === "undefined" && typeof preview.getMesh === "undefined");
        check("preview reports one sane displacement per source vertex",
            preview.displacementsMm instanceof Float32Array
            && preview.displacementsMm.length === cubeMesh.vertProperties.length / 3
            && preview.displacementsMm.every((value) => Math.abs(value - 6) < 1e-4),
            Array.from(preview.displacementsMm).map((value) => value.toFixed(4)).join(","));
        const boundedPreview = H.previewShell(cube, 6, { maxSamples: 3 });
        check("bounded preview respects maxSamples",
            boundedPreview.sampleCount === 3 && boundedPreview.displacementsMm.length === 3,
            `${boundedPreview.sampleCount} samples`);

        let previewThinPlate = null;
        try {
            previewThinPlate = wasm.Manifold.cube([30, 30, 5], true);
            const thinPreview = H.previewShell(previewThinPlate, 6, { maxSamples: 4 });
            const previewCodes = H.wallWarnings(
                previewWallStats(thinPreview.displacementsMm), 6).map((warning) => warning.code);
            check("thin preview yields wall warning codes before Apply",
                thinPreview.sampleCount === 4
                && previewCodes.includes("thin-wall") && previewCodes.includes("thin-wall-hard"),
                `${thinPreview.sampleCount} samples; ${previewCodes.join(",")}`);
        } finally {
            dispose(previewThinPlate);
        }
        const meshCube = H.hollow(cube, 6);
        ownedResults.push(meshCube.hollow);
        check("mesh cube exact volume", Math.abs(meshCube.stats.volumeAfterMm3 - 105408) < 1e-6,
            meshCube.stats.volumeAfterMm3.toFixed(9));
        check("selector sends 12-triangle cube to mesh",
            meshCube.stats.engineUsed === "mesh" && !meshCube.stats.fellBack);
        check("mesh cube NoError + watertight", statusOk(meshCube.hollow));
        check("savedPct arithmetic", Math.abs(meshCube.stats.savedPct
            - 100 * (1 - meshCube.stats.volumeAfterMm3 / meshCube.stats.volumeBeforeMm3)) < 1e-12,
            meshCube.stats.savedPct.toFixed(6));
        check("fat cube has no wall warnings", warningCodes(meshCube).length === 0,
            warningCodes(meshCube).join(","));

        const hardWall = H.hollow(cube, 1.2, { engine: "mesh" });
        ownedResults.push(hardWall.hollow);
        const hardWallCodes = warningCodes(hardWall);
        check("sub-1.6 mm wall gets hard warning only",
            hardWallCodes.includes("thin-wall-hard") && !hardWallCodes.includes("thin-wall"),
            `${hardWall.stats.wallStats.minMm.toFixed(4)} mm; ${hardWallCodes.join(",")}`);

        const gridCube = H.hollow(cube, 6, { engine: "grid" });
        ownedResults.push(gridCube.hollow);
        const gridErrorPct = 100 * Math.abs(gridCube.stats.volumeAfterMm3 - 105408) / 105408;
        check("grid cube within 0.6%", gridErrorPct <= 0.6, `${gridErrorPct.toFixed(4)}%`);
        check("grid cube engine", gridCube.stats.engineUsed === "grid" && !gridCube.stats.fellBack);
        check("grid cube NoError + watertight", statusOk(gridCube.hollow));

        const estimate = H.estimate(cube, 6);
        check("estimate within 15% of real savedPct",
            Math.abs(estimate - meshCube.stats.savedPct) <= Math.abs(meshCube.stats.savedPct) * 0.15,
            `${estimate.toFixed(3)} vs ${meshCube.stats.savedPct.toFixed(3)}`);

        refined = refinedIcosphere(wasm, 20, 6);
        check("refined icosphere fixture over 50k", refined.numTri() > 50000,
            `${refined.numTri()} triangles`);
        const selectedGrid = H.hollow(refined, 6);
        ownedResults.push(selectedGrid.hollow);
        check("selector sends refined icosphere to grid",
            selectedGrid.stats.engineUsed === "grid" && !selectedGrid.stats.fellBack);
        check("selected grid result NoError + watertight", statusOk(selectedGrid.hollow));

        thinRefined = refinedIcosphere(wasm, 20, 6, 0.2);
        const tripped = H.hollow(thinRefined, 6, { engine: "mesh" });
        ownedResults.push(tripped.hollow);
        check("D2 tripwire fires and falls back", tripped.stats.engineUsed === "grid" && tripped.stats.fellBack,
            `${tripped.stats.engineUsed}, fellBack=${tripped.stats.fellBack}`);
        check("D2 fallback records RMS tripwire", tripped.stats.tripwireReasons.includes("rms"),
            tripped.stats.tripwireReasons.join(","));
        check("fallback result NoError + watertight", statusOk(tripped.hollow));

        let thinPlate = null;
        try {
            thinPlate = wasm.Manifold.cube([30, 30, 5], true);
            const thinResult = H.hollow(thinPlate, 6);
            ownedResults.push(thinResult.hollow);
            const codes = warningCodes(thinResult);
            check("thin fin warns", codes.includes("thin-wall") || codes.includes("thin-wall-hard"),
                codes.join(","));
            check("thin fin result NoError + watertight", statusOk(thinResult.hollow));
        } finally {
            dispose(thinPlate);
        }

        let cavitySource = null;
        try {
            const first = translated(wasm.Manifold.sphere(6, 24), [-12, 0, 0]);
            const second = translated(wasm.Manifold.sphere(6, 24), [12, 0, 0]);
            cavitySource = subtractAll(wasm.Manifold.cube([60, 40, 40], true), [first, second]);
            const cavities = H.hollow(cavitySource, 2);
            ownedResults.push(cavities.hollow);
            check("multi-cavity result NoError + watertight", statusOk(cavities.hollow));
            check("first interior cavity preserved", cavityIsOpen(wasm, cavities.hollow, [-12, 0, 0]));
            check("second interior cavity preserved", cavityIsOpen(wasm, cavities.hollow, [12, 0, 0]));
        } finally {
            dispose(cavitySource);
        }

        let completedStages = 0, cancelled = false;
        try {
            H.hollow(cube, 6, {
                onProgress: (_stage, fraction) => { if (fraction === 1) completedStages++; },
                shouldCancel: () => completedStages >= 1,
            });
        } catch (error) {
            cancelled = error instanceof H.HollowCancelled && error.name === "HollowCancelled";
        }
        check("cancellation throws typed HollowCancelled", cancelled);
        const afterCancel = H.hollow(cube, 6, { engine: "mesh" });
        ownedResults.push(afterCancel.hollow);
        check("same source succeeds after cancellation", statusOk(afterCancel.hollow)
            && Math.abs(afterCancel.stats.volumeAfterMm3 - 105408) < 1e-6);

        checkOpenFacesAndHoles(wasm, H, cube);
        checkRawAuditGoldens(wasm, H);

        document.title = failures.length ? `FAIL: ${failures.join("; ")}` : "PASS";
    } catch (error) {
        log("EXCEPTION: " + (error.stack || error));
        document.title = "FAIL: exception — " + error.message;
    } finally {
        for (const result of ownedResults) dispose(result);
        dispose(thinRefined); dispose(refined); dispose(cube);
    }
})();
</script>
</body>
</html>
